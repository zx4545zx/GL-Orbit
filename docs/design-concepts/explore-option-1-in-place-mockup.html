<!-- GL-Orbit /th/explore information architecture mockup — approved option 1 -->
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>สำรวจ — Option 1 Mockup | GL-Orbit</title>
  <style>
    :root{--orbit-paper:#fbf3e4;--orbit-paper-deep:#f3e7cf;--orbit-surface:#fff;--orbit-ink:#3b2a20;--orbit-muted:#8a725f;--orbit-line:#d8c4a8;--orbit-line-strong:#b8a288;--orbit-coral:#e4572e;--orbit-coral-dark:#b23f1d;--orbit-coral-soft:#fde4d6;--orbit-lavender:#f6c9d8;--orbit-mint:#cfe7f5;--shadow:4px 4px 0 var(--orbit-line)}
    *{box-sizing:border-box;border-radius:0}html{background:var(--orbit-paper)}body{margin:0;color:var(--orbit-ink);font-family:"Mali","Sarabun",system-ui,sans-serif;background:linear-gradient(90deg,transparent 23px,rgba(216,196,168,.25) 24px),linear-gradient(transparent 23px,rgba(216,196,168,.25) 24px);background-size:24px 24px}button,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--orbit-coral-dark);outline-offset:2px}.shell{width:min(1180px,100%);margin:auto;padding:0 24px 72px}.topline{height:8px;background:var(--orbit-coral)}header{background:var(--orbit-surface);border:1px solid var(--orbit-line-strong);border-top:0}.nav{height:68px;display:flex;align-items:center;gap:24px;padding:0 22px}.brand{font-family:Georgia,serif;font-weight:900;font-size:22px;letter-spacing:-.04em}.brand b{color:var(--orbit-coral)}.navlinks{display:flex;gap:20px;margin-left:auto;font-size:14px;font-weight:700}.navlinks span:first-child{color:var(--orbit-coral)}.avatar{width:36px;height:36px;border-radius:50%;background:var(--orbit-lavender);border:1px solid var(--orbit-line-strong);display:grid;place-items:center}.crumb{padding:9px 22px;border-top:1px solid var(--orbit-line);font-size:12px;color:var(--orbit-muted)}
    .intro{margin-top:28px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orbit-coral-dark)}h1{font-family:Georgia,"Mali",serif;font-size:clamp(36px,6vw,72px);line-height:.95;margin:6px 0 10px;letter-spacing:-.045em}.lede{margin:0;color:var(--orbit-muted);max-width:650px}.issue{font-size:12px;text-align:right;border-left:1px solid var(--orbit-line-strong);padding-left:18px}.issue b{display:block;font-size:28px;font-family:Georgia,serif}
    .controls{position:sticky;top:0;z-index:4;margin-top:26px;background:var(--orbit-surface);border:1px solid var(--orbit-line-strong);box-shadow:var(--shadow)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--orbit-line-strong)}.tab{min-height:52px;border:0;border-right:1px solid var(--orbit-line-strong);background:var(--orbit-surface);font-weight:800}.tab:last-child{border-right:0}.tab[aria-selected=true]{background:var(--orbit-ink);color:var(--orbit-paper)}.tab small{margin-left:5px;opacity:.65}.toolrow{display:flex;gap:12px;padding:12px}.search{display:flex;flex:1;min-height:46px;border:1px solid var(--orbit-line-strong);background:var(--orbit-paper)}.search span{width:46px;display:grid;place-items:center;border-right:1px solid var(--orbit-line)}.search input{width:100%;min-width:0;border:0;background:transparent;padding:0 12px;font-size:16px}.search input:focus{outline:0}.overview-btn{min-height:46px;padding:0 18px;border:1px solid var(--orbit-line-strong);background:var(--orbit-mint);font-weight:800}.overview-btn:disabled{opacity:.45;cursor:not-allowed}.filters{display:none;padding:0 12px 12px;gap:8px;overflow:auto}.filters.show{display:flex}.filter{min-height:44px;white-space:nowrap;padding:0 15px;border:1px solid var(--orbit-line-strong);background:var(--orbit-surface);font-weight:700}.filter[aria-pressed=true]{background:var(--orbit-coral);color:#fff;border-color:var(--orbit-coral-dark)}
    main{margin-top:28px}.hero{display:grid;grid-template-columns:1.25fr .75fr;border:1px solid var(--orbit-line-strong);background:var(--orbit-surface)}.hero-art{min-height:370px;border-right:1px solid var(--orbit-line-strong);background:linear-gradient(145deg,var(--orbit-lavender),var(--orbit-coral-soft) 52%,var(--orbit-mint));display:flex;align-items:flex-end;padding:28px;position:relative;overflow:hidden}.hero-art:before{content:"24";position:absolute;right:-10px;top:-45px;font:900 240px/1 Georgia;color:rgba(59,42,32,.08)}.poster-stack{font:900 clamp(38px,6vw,72px)/.92 Georgia,"Mali",serif;max-width:550px;position:relative}.hero-copy{padding:30px;display:flex;flex-direction:column;justify-content:center}.label{display:inline-block;align-self:flex-start;padding:5px 8px;background:var(--orbit-coral);color:#fff;font-size:11px;font-weight:800}.hero-copy h2{font:800 30px/1.2 Georgia,"Mali",serif;margin:16px 0 10px}.hero-copy p{color:var(--orbit-muted);line-height:1.7}.cta{min-height:44px;border:1px solid var(--orbit-ink);background:var(--orbit-ink);color:#fff;padding:0 16px;font-weight:800;align-self:flex-start}.rail{margin-top:34px}.rail-head,.results-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.rail h2,.results-head h2{font:800 25px Georgia,"Mali",serif;margin:0}.rail-head button{min-height:44px;border:0;background:transparent;color:var(--orbit-coral-dark);font-weight:800}.rail-grid,.results-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--orbit-line-strong);border-left:1px solid var(--orbit-line-strong)}
    .card{min-width:0;background:var(--orbit-surface);border:0;border-right:1px solid var(--orbit-line-strong);border-bottom:1px solid var(--orbit-line-strong);padding:0;text-align:left}.card:hover .art{filter:saturate(1.18)}.art{aspect-ratio:4/5;display:flex;align-items:flex-end;padding:14px;background:var(--tone);position:relative;overflow:hidden;transition:filter .15s}.art:after{content:attr(data-mark);position:absolute;right:-7px;top:-22px;font:900 130px Georgia;color:rgba(59,42,32,.10)}.kind-artists .art,.kind-ships .art{aspect-ratio:1/1}.art span{position:relative;z-index:1;background:var(--orbit-surface);border:1px solid var(--orbit-line-strong);padding:4px 7px;font-size:10px;font-weight:800}.meta{padding:14px;min-height:104px}.meta h3{font-size:16px;margin:0 0 4px}.meta p{font-size:12px;color:var(--orbit-muted);margin:0}.status{margin-top:10px;font-size:11px;font-weight:800;color:var(--orbit-coral-dark)}.results-head{padding-top:4px}.results-head p{margin:4px 0 0;color:var(--orbit-muted);font-size:13px}.empty{grid-column:1/-1;text-align:center;background:var(--orbit-surface);border-right:1px solid var(--orbit-line-strong);border-bottom:1px solid var(--orbit-line-strong);padding:64px 20px}.empty strong{font:800 24px Georgia,"Mali",serif;display:block}.empty p{color:var(--orbit-muted)}.empty button{min-height:44px;background:var(--orbit-coral);color:#fff;border:1px solid var(--orbit-coral-dark);padding:0 18px;font-weight:800}
    @media(max-width:760px){.navlinks{display:none}.hero{grid-template-columns:1fr}.hero-art{border-right:0;border-bottom:1px solid var(--orbit-line-strong);min-height:280px}.rail-grid,.results-grid{grid-template-columns:repeat(2,1fr)}.issue{display:none}.intro{grid-template-columns:1fr}.toolrow{flex-wrap:wrap}.overview-btn{width:100%}}
    @media(max-width:400px){.shell{padding:0 12px 56px}.nav{height:60px;padding:0 14px}.crumb{padding:8px 14px}.intro{margin-top:22px}h1{font-size:40px}.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}.tab{font-size:12px;padding:4px}.tab small{display:none}.toolrow{padding:10px}.hero-art{min-height:230px;padding:18px}.hero-copy{padding:20px}.hero-copy h2{font-size:25px}.rail-grid,.results-grid{grid-template-columns:1fr 1fr}.meta{padding:11px;min-height:112px}.meta h3{font-size:14px}.art{padding:9px}.results-head{align-items:start;flex-direction:column}.controls{margin-top:20px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="topline"></div><div class="shell"><header><div class="nav"><div class="brand">GL<b>•</b>ORBIT</div><nav class="navlinks" aria-label="เมนูหลัก"><span>สำรวจ</span><span>ปฏิทิน</span><span>Halo</span><span>รายการของฉัน</span></nav><div class="avatar orbit-round-data" aria-label="โปรไฟล์">อ</div></div><div class="crumb">หน้าหลัก / <b>สำรวจ</b> · MOCKUP OPTION 1</div></header>
  <section class="intro"><div><div class="eyebrow">Explore the orbit</div><h1>สำรวจโลก GL</h1><p class="lede">เรื่องที่อยากดู นักแสดงที่อยากรู้จัก และคู่ที่แฟน ๆ กำลังพูดถึง — ค้นหาทุกอย่างได้ในที่เดียว</p></div><div class="issue">ฉบับประจำสัปดาห์<b>27.07</b>อัปเดตล่าสุดวันนี้</div></section>
  <section class="controls" aria-label="เครื่องมือสำรวจ"><div class="tabs" role="tablist" aria-label="ประเภทเนื้อหา"><button class="tab" role="tab" data-mode="series" aria-selected="false">ซีรีส์ <small>18</small></button><button class="tab" role="tab" data-mode="artists" aria-selected="false">นักแสดง <small>24</small></button><button class="tab" role="tab" data-mode="ships" aria-selected="false">คู่จิ้น <small>12</small></button></div><div class="toolrow"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="ค้นหา" placeholder="ค้นหาในทุกหมวด..."></label><button class="overview-btn" id="overview" disabled>← กลับหน้ารวม</button></div><div class="filters" id="filters" aria-label="สถานะซีรีส์"><button class="filter" data-filter="all" aria-pressed="true">ทั้งหมด</button><button class="filter" data-filter="ONGOING" aria-pressed="false">กำลังฉาย</button><button class="filter" data-filter="UPCOMING" aria-pressed="false">เร็ว ๆ นี้</button><button class="filter" data-filter="ENDED" aria-pressed="false">จบแล้ว</button></div></section>
  <main id="content" aria-live="polite"></main></div>
  <script>
    const data={series:[
      {name:'ใจซ่อนรัก',sub:'The Secret of Us · Channel 3',status:'ONGOING',mark:'ใจ',tone:'#f6c9d8'},
      {name:'หยดฝนกลิ่นสนิม',sub:'Petrichor · iQIYI',status:'ONGOING',mark:'ฝน',tone:'#cfe7f5'},
      {name:'ล้านวงโคจร',sub:'Reverse 4 You · Netflix',status:'ENDED',mark:'∞',tone:'#e8d9ff'},
      {name:'เพียงเธอ',sub:'Only You · เร็ว ๆ นี้',status:'UPCOMING',mark:'๑',tone:'#fde4d6'},
      {name:'23.5 องศาที่โลกเอียง',sub:'23.5 · GMMTV',status:'ENDED',mark:'23',tone:'#f8d8a8'},
      {name:'รักปากแข็ง',sub:'Somewhere Somehow',status:'UPCOMING',mark:'รัก',tone:'#d5ead4'}],
      artists:[{name:'หลิงหลิง คอง',sub:'นักแสดง · 1.2M ผู้ติดตาม',mark:'LL',tone:'#f6c9d8'},{name:'ออม กรณ์นภัส',sub:'นักแสดง · 1.1M ผู้ติดตาม',mark:'Orm',tone:'#fde4d6'},{name:'ฟรีน สโรชา',sub:'นักแสดง · 2.4M ผู้ติดตาม',mark:'F',tone:'#cfe7f5'},{name:'เบ็คกี้ รีเบคก้า',sub:'นักแสดง · 2.2M ผู้ติดตาม',mark:'B',tone:'#e8d9ff'},{name:'น้ำ อรจิรา',sub:'นักแสดง · 640K ผู้ติดตาม',mark:'N',tone:'#d5ead4'},{name:'ฟิล์ม รชานันท์',sub:'นักแสดง · 920K ผู้ติดตาม',mark:'Film',tone:'#f8d8a8'}],
      ships:[{name:'หลิงออม',sub:'หลิงหลิง × ออม · 8 ซีรีส์/อีเวนต์',mark:'LO',tone:'#f6c9d8'},{name:'ฟรีนเบ็ค',sub:'ฟรีน × เบ็คกี้ · 12 ซีรีส์/อีเวนต์',mark:'FB',tone:'#cfe7f5'},{name:'น้ำหนึ่งเนย',sub:'น้ำหนึ่ง × เนย · 6 ซีรีส์/อีเวนต์',mark:'NN',tone:'#fde4d6'},{name:'มิ้ลค์เลิฟ',sub:'มิ้ลค์ × เลิฟ · 7 ซีรีส์/อีเวนต์',mark:'ML',tone:'#e8d9ff'},{name:'น้ำตาลฟิล์ม',sub:'น้ำตาล × ฟิล์ม · 5 ซีรีส์/อีเวนต์',mark:'NF',tone:'#d5ead4'},{name:'ฟอยเบลล์',sub:'ฟอย × เบลล์ · คู่มาแรงประจำสัปดาห์',mark:'✦',tone:'#f8d8a8'}]};
    const labels={series:'ซีรีส์',artists:'นักแสดง',ships:'คู่จิ้น'};let mode=null,filter='all',query='';
    const content=document.querySelector('#content'),search=document.querySelector('#search'),filters=document.querySelector('#filters'),overview=document.querySelector('#overview');
    function card(x,type){const status=x.status?`<div class="status">${{ONGOING:'● กำลังฉาย',UPCOMING:'◇ เร็ว ๆ นี้',ENDED:'✓ จบแล้ว'}[x.status]}</div>`:'';return `<button class="card kind-${type}" aria-label="เปิด ${x.name}"><div class="art" style="--tone:${x.tone}" data-mark="${x.mark}"><span>${labels[type]}</span></div><div class="meta"><h3>${x.name}</h3><p>${x.sub}</p>${status}</div></button>`}
    function overviewView(){return `<section class="hero"><div class="hero-art"><div class="poster-stack">เรื่องรักใหม่<br>ในวงโคจรเดิม</div></div><div class="hero-copy"><span class="label">EDITOR'S PICK</span><h2>ซีรีส์ที่แฟน GL กำลังจับตา</h2><p>รวมเรื่องใหม่ประจำสัปดาห์ พร้อมวันฉาย แพลตฟอร์ม และนักแสดงครบในหน้าเดียว</p><button class="cta" data-open="series">ดูซีรีส์ทั้งหมด →</button></div></section><section class="rail"><div class="rail-head"><div><div class="eyebrow">Trending now</div><h2>กำลังอยู่ในวงสนทนา</h2></div><button data-open="ships">ดูคู่จิ้นทั้งหมด →</button></div><div class="rail-grid">${data.ships.slice(0,4).map(x=>card(x,'ships')).join('')}</div></section>`}
    function render(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.mode===mode)));filters.classList.toggle('show',mode==='series');overview.disabled=!mode&&!query&&filter==='all';search.placeholder=mode?`ค้นหา${labels[mode]}...`:'ค้นหาในทุกหมวด...';if(!mode&&!query&&filter==='all'){content.innerHTML=overviewView();return}const active=mode||'series';let rows=data[active].filter(x=>(filter==='all'||x.status===filter)&&(`${x.name} ${x.sub}`).toLowerCase().includes(query.toLowerCase()));content.innerHTML=`<section><div class="results-head"><div><div class="eyebrow">Focused results</div><h2>${query?`ผลการค้นหา “${query}”`:labels[active]+'ทั้งหมด'}</h2><p>พบ ${rows.length} รายการ${filter!=='all'?'ในสถานะที่เลือก':''}</p></div></div><div class="results-grid">${rows.length?rows.map(x=>card(x,active)).join(''):`<div class="empty"><strong>ยังไม่พบรายการที่ตรงกัน</strong><p>ลองเปลี่ยนคำค้นหรือเลือกตัวกรองอื่น</p><button id="clear">ล้างการค้นหาและตัวกรอง</button></div>`}</div></section>`}
    document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;filter='all';document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.filter==='all')));render()});
    filters.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});
    search.addEventListener('input',()=>{query=search.value.trim();render()});overview.addEventListener('click',()=>{mode=null;filter='all';query='';search.value='';document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.filter==='all')));render();scrollTo({top:0,behavior:'smooth'})});
    content.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){mode=open.dataset.open;render();document.querySelector('.controls').scrollIntoView({behavior:'smooth'})}if(e.target.id==='clear'){query='';filter='all';search.value='';document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.filter==='all')));render()}});render();
  </script>
</body>
</html>
